<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>European Resilience — Project A</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />

  <style>
    /* ── Reset ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white:      #ffffff;
      --bg:         #f7f9fa;
      --card-bg:    #eff1f2;
      --border:     #e5e7e9;
      --text:       #1a1a1a;
      --text-mid:   #5a5a5a;
      --text-muted: #9a9a9a;
      --lime:       #c8f135;
      --radius:     16px;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans:  'DM Sans', -apple-system, sans-serif;
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
      overflow-x: hidden;
    }

    body {
      background: var(--white);
      color: var(--text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      max-width: 100vw;
    }

    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    /* ── Nav ───────────────────────────────────────────────────── */
    .nav {
      position: sticky;
      top: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 76px;
      padding: 0 40px;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }

    /* Project A logo — embedded PNG, mix-blend-mode removes gray canvas on white nav */
    .nav-logo {
      display: flex;
      align-items: center;
      transition: opacity 0.2s;
      line-height: 1;
    }
    .nav-logo:hover { opacity: 0.55; }

    .nav-logo-img {
      height: 30px;
      width: auto;
      mix-blend-mode: multiply;
      display: block;
    }

    /* Footer version slightly smaller */
    .footer-logo-img {
      height: 26px;
      width: auto;
      mix-blend-mode: multiply;
      display: block;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-label {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-mid);
      border-bottom: 1px solid var(--text-mid);
      padding-bottom: 1px;
    }

    .nav-ext {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-muted);
      transition: color 0.15s;
    }
    .nav-ext:hover { color: var(--text); }

    /* ── Hero ──────────────────────────────────────────────────── */
    .hero-wrap {
      border-bottom: 1px solid var(--border);
    }

    .hero {
      max-width: 1400px;
      margin: 0 auto;
      padding: 64px 32px 60px;
    }

    .hero-eyebrow {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .hero-title {
      font-family: var(--font-serif);
      font-size: clamp(52px, 8vw, 112px);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: -0.03em;
      color: var(--text);
      margin-bottom: 48px;
    }

    .hero-title em { font-style: italic; }

    .hero-bottom {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 32px;
      flex-wrap: wrap;
    }

    .hero-description {
      font-size: 16px;
      font-weight: 300;
      line-height: 1.75;
      color: var(--text-mid);
      max-width: 460px;
    }

    .hero-pills {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    .hero-pill {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 18px 24px;
      min-width: 88px;
    }

    .hero-pill.accent { background: var(--lime); }

    .hero-pill-n {
      font-family: var(--font-serif);
      font-size: 38px;
      font-weight: 400;
      line-height: 1;
    }

    .hero-pill-l {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* ── Section ───────────────────────────────────────────────── */
    .section-wrap { border-bottom: 1px solid var(--border); }

    .section {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 32px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 52px 0 32px;
      border-bottom: 1px solid var(--border);
    }

    .section-num {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .section-title {
      font-family: var(--font-serif);
      font-size: clamp(24px, 3vw, 40px);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .section-ct {
      margin-left: auto;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    /* ── Cards grid ────────────────────────────────────────────── */
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      padding: 28px 0 52px;
    }

    @media (min-width: 768px) {
      .cards-grid { grid-template-columns: 1fr 1fr; }
    }

    @media (min-width: 1200px) {
      .cards-grid { grid-template-columns: 1fr 1fr 1fr; }
    }

    /* ── Flip card ─────────────────────────────────────────────── */
    .card-wrap {
      perspective: 1200px;
      height: 620px;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: var(--radius);
    }

    .card-inner.flipped {
      transform: rotateY(180deg);
    }

    /* ── Front face ────────────────────────────────────────────── */
    .card-front,
    .card-back {
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card-front {
      cursor: pointer;
      background: #1a1a1a;
    }

    .card-front-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      transition: transform 0.4s ease;
    }

    .card-front:hover .card-front-img {
      transform: scale(1.03);
    }

    .card-front-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.0) 0%,
        rgba(0,0,0,0.0) 40%,
        rgba(0,0,0,0.65) 75%,
        rgba(0,0,0,0.85) 100%
      );
      pointer-events: none;
    }

    .card-front-top {
      display: flex;
      justify-content: flex-end;
    }

    .card-industry-badge {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.85);
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 5px 10px;
      border-radius: 100px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .card-front-bottom {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-front-name {
      font-family: var(--font-serif);
      font-size: clamp(22px, 3vw, 30px);
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .card-front-tagline {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 14px;
      color: rgba(255,255,255,0.7);
      line-height: 1.4;
    }

    .card-front-hint {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--lime);
    }

    .card-front-hint svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    /* ── Back face ─────────────────────────────────────────────── */
    .card-back {
      transform: rotateY(180deg);
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .card-back-header {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .card-back-name {
      font-family: var(--font-serif);
      font-size: 17px;
      font-weight: 400;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .card-back-hint {
      font-size: 11px;
      font-weight: 400;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }

    .card-back-scroll {
      overflow: hidden;
      flex: 1;
      padding: 16px 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .back-tagline {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 15px;
      color: var(--text-mid);
      line-height: 1.45;
    }

    .back-description {
      font-size: 13px;
      font-weight: 300;
      line-height: 1.8;
      color: var(--text-mid);
    }

    .back-highlight {
      background: var(--white);
      border-radius: 8px;
      padding: 14px 16px;
      border-left: 3px solid var(--lime);
    }

    .back-highlight-label {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .back-highlight-text {
      font-size: 12px;
      line-height: 1.55;
      color: var(--text);
    }

    .back-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .back-meta-item { display: flex; flex-direction: column; gap: 2px; }

    .back-meta-label {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .back-meta-value {
      font-size: 12px;
      color: var(--text-mid);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      background: var(--white);
      padding: 9px 16px;
      border-radius: 100px;
      border: 1.5px solid var(--border);
      transition: background 0.18s, border-color 0.18s;
      align-self: flex-start;
      margin-top: auto;
    }

    .back-link:hover {
      background: var(--lime);
      border-color: var(--lime);
    }

    .back-stealth {
      font-size: 12px;
      font-style: italic;
      color: var(--text-muted);
      margin-top: auto;
    }

    /* ── Footer ────────────────────────────────────────────────── */
    .footer {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .footer-logo {
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: var(--font-serif);
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .footer-copy { font-size: 12px; color: var(--text-muted); }

    .footer-link {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-mid);
      transition: color 0.15s;
    }
    .footer-link:hover { color: var(--text); }

    /* ── Mobile ────────────────────────────────────────────────── */
    @media (max-width: 640px) {
      .nav { padding: 0 16px; }
      .nav-label { display: none; }
      .nav-ext { display: none; }

      .hero { padding: 40px 16px 48px; }

      .hero-pills { gap: 8px; }
      .hero-pill { padding: 14px 16px; min-width: 72px; }
      .hero-pill-n { font-size: 30px; }

      .section { padding: 0 16px; }
      .section-header { padding: 40px 0 24px; gap: 10px; }

      .cards-grid { gap: 12px; padding: 20px 0 40px; }

      .card-wrap { height: 600px; }

      .card-back-scroll { padding: 16px 14px 20px; }

      .footer { padding: 32px 16px; }
    }
  </style>
</head>

    // ─────────────────────────────────────────────────────────────────────────
    // RENDERER
    // ─────────────────────────────────────────────────────────────────────────

    function flipCard(id) {
      const el = document.getElementById(id);
      if (el) el.classList.toggle('flipped');
    }

    function buildCard(company, sid, cid) {
      const id = 'card-' + sid + '-' + cid;

      const linkEl = company.website
        ? '<a href="' + company.website + '" target="_blank" rel="noopener" class="back-link" onclick="event.stopPropagation()">Visit website ↗</a>'
        : '<span class="back-stealth">Stealth — no public website yet</span>';

      const hc = company.headcount === 'TBD'
        ? '<em style="opacity:0.5">TBD</em>'
        : company.headcount;

      return '<div class="card-wrap">'
        // onclick on card-inner → tap anywhere on either face to flip
        + '<div class="card-inner" id="' + id + '" onclick="flipCard(\'' + id + '\')" style="cursor:pointer">'

        // FRONT
        + '<div class="card-front">'
        + '<img class="card-front-img" src="' + company.image + '" alt="' + company.name + '" loading="lazy" />'
        + '<div class="card-front-overlay">'
        + '<div class="card-front-top">'
        + '<span class="card-industry-badge">' + company.industry + '</span>'
        + '</div>'
        + '<div class="card-front-bottom">'
        + '<h3 class="card-front-name">' + company.name + '</h3>'
        + '<p class="card-front-tagline">' + company.tagline + '</p>'
        + '<div class="card-front-hint">'
        + '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 1v12M1 7l6 6 6-6"/></svg>'
        + 'Tap to explore'
        + '</div>'
        + '</div>'
        + '</div>'
        + '</div>'

        // BACK — tap anywhere to flip back; stopPropagation on the link only
        + '<div class="card-back">'
        + '<div class="card-back-header">'
        + '<span class="card-back-name">' + company.name + '</span>'
        + '<span class="card-back-hint">Tap to flip ↩</span>'
        + '</div>'
        + '<div class="card-back-scroll">'
        + '<p class="back-tagline">' + company.tagline + '</p>'
        + '<p class="back-description">' + company.description + '</p>'
        + '<div class="back-highlight">'
        + '<p class="back-highlight-label">Highlight</p>'
        + '<p class="back-highlight-text">' + company.highlight + '</p>'
        + '</div>'
        + '<div class="back-meta">'
        + '<div class="back-meta-item"><span class="back-meta-label">Founded</span><span class="back-meta-value">' + company.founded + '</span></div>'
        + '<div class="back-meta-item"><span class="back-meta-label">HQ</span><span class="back-meta-value">' + company.hq + '</span></div>'
        + '<div class="back-meta-item"><span class="back-meta-label">Team size</span><span class="back-meta-value">' + hc + '</span></div>'
        + '<div class="back-meta-item"><span class="back-meta-label">Management</span><span class="back-meta-value">' + company.team.join(' · ') + '</span></div>'
        + '</div>'
        + linkEl
        + '</div>'
        + '</div>'

        + '</div>'
        + '</div>';
    }

    function buildSection(section, sid) {
      const cards = section.companies.map(function(c, cid) {
        return buildCard(c, sid, cid);
      }).join('');

      return '<div class="section-wrap">'
        + '<div class="section">'
        + '<div class="section-header">'
        + '<span class="section-num">' + section.number + '</span>'
        + '<h2 class="section-title">' + section.title + '</h2>'
        + '<span class="section-ct">' + section.companies.length + ' companies</span>'
        + '</div>'
        + '<div class="cards-grid">' + cards + '</div>'
        + '</div>'
        + '</div>';
    }

    const total = sections.reduce(function(s, sec) { return s + sec.companies.length; }, 0);
    document.getElementById('stat-companies').textContent = total;
    document.getElementById('portfolio').innerHTML = sections.map(buildSection).join('');
  </script>
